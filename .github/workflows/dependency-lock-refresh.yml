name: Refresh and validate security dependency lockfile

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/nextjs-15-upgrade
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Regenerate lockfile with security overrides
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Clean install
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
      - name: Self-contained regression suites
        shell: bash
        run: |
          set -e
          for f in test/swipe-limits-rolling-24h-suite.ts test/catalog-hub-db-pagination-suite.ts test/catalog-touch-update-retry-suite.ts test/job-filter-data-quality-suite.ts test/ttl-cache-stale-invalidation-suite.ts test/main-feed-characterization-suite.ts test/main-feed-benchmark.ts test/employer-company-accounts-suite.ts test/employer-job-publishing-suite.ts; do
            if [ -f "$f" ]; then
              echo "::group::$f"
              npx tsx "$f"
              echo "::endgroup::"
            fi
          done
      - name: Audit and write report
        shell: bash
        run: |
          set +e
          npm audit --json > /tmp/npm-audit.json
          AUDIT_EXIT=$?
          export AUDIT_EXIT
          node - <<'NODE'
          const fs = require('fs');
          let audit = {};
          try { audit = JSON.parse(fs.readFileSync('/tmp/npm-audit.json', 'utf8')); } catch {}
          const v = audit.metadata?.vulnerabilities || {};
          const findings = Object.entries(audit.vulnerabilities || {}).map(([name, item]) => {
            const advisories = Object.values(item.via || {}).filter(x => typeof x === 'object').map(x => `${x.title} (${x.url || 'no URL'})`);
            return `- ${name}: ${item.severity}; direct=${item.isDirect}; fixAvailable=${JSON.stringify(item.fixAvailable)}; advisories=${advisories.join('; ')}`;
          });
          const report = [
            '# Dependency audit after security overrides',
            '',
            '- npm audit exit: ' + process.env.AUDIT_EXIT,
            '- Counts: ' + JSON.stringify(v),
            '',
            '## Findings',
            ...(findings.length ? findings : ['- No known vulnerabilities reported.'])
          ].join('\n');
          fs.writeFileSync('.security-audit-report.md', report + '\n');
          NODE
      - name: Commit lockfile and audit report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .security-audit-report.md
          git rm .github/workflows/dependency-lock-refresh.yml
          git commit -m "security: refresh lockfile with patched transitive dependencies"
          git push origin HEAD:refs/heads/security/nextjs-15-upgrade
