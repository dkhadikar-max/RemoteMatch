name: Refresh security dependency lockfile

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/nextjs-15-upgrade
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify clean install
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
      - name: Audit dependencies
        shell: bash
        run: |
          set +e
          npm audit --json > /tmp/npm-audit.json
          AUDIT_EXIT=$?
          export AUDIT_EXIT
          node - <<'NODE'
          const fs = require('fs');
          let audit = {};
          try { audit = JSON.parse(fs.readFileSync('/tmp/npm-audit.json', 'utf8')); } catch {}
          const v = audit.metadata?.vulnerabilities || {};
          const rows = Object.entries(audit.vulnerabilities || {}).map(([name, item]) =>
            `- ${name}: ${item.severity}; direct=${item.isDirect}; fixAvailable=${JSON.stringify(item.fixAvailable)}`
          );
          const report = [
            '# Dependency audit after security overrides',
            '',
            '- npm audit exit: ' + process.env.AUDIT_EXIT,
            '- Counts: ' + JSON.stringify(v),
            '',
            '## Findings',
            ...(rows.length ? rows : ['- No known vulnerabilities reported.'])
          ].join('\n');
          fs.writeFileSync('.security-audit-report.md', report + '\n');
          NODE
      - name: Commit refreshed lockfile and audit report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .security-audit-report.md
          git rm .github/workflows/dependency-lock-refresh.yml
          git commit -m "security: refresh lockfile with patched transitive dependencies"
          git push origin HEAD:refs/heads/security/nextjs-15-upgrade
