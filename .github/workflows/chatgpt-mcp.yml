name: ChatGPT MCP service

on:
  pull_request:
    branches: [main]
    paths:
      - 'mcp-server/**'
      - '.github/workflows/chatgpt-mcp.yml'
  push:
    branches: [main]
    paths:
      - 'mcp-server/**'
      - '.github/workflows/chatgpt-mcp.yml'

permissions:
  contents: read

jobs:
  mcp-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install MCP service dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck MCP service
        run: npm run typecheck
      - name: MCP protocol and tool smoke test
        run: npm test
