name: Temporary dependency lockfile refresh

on:
  push:
    branches: [security/nextjs-15-upgrade]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Regenerate lockfile and run project CI checks
        shell: bash
        run: |
          set +e
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          LOCKFILE_EXIT=$?

          npm ci
          INSTALL_EXIT=$?

          TYPECHECK_EXIT=not_run
          BUILD_EXIT=not_run
          SUITES_EXIT=not_run
          if [ "$INSTALL_EXIT" -eq 0 ]; then
            npx tsc --noEmit
            TYPECHECK_EXIT=$?

            npm run build
            BUILD_EXIT=$?

            SUITES_EXIT=0
            for f in test/swipe-limits-rolling-24h-suite.ts test/catalog-hub-db-pagination-suite.ts test/catalog-touch-update-retry-suite.ts test/job-filter-data-quality-suite.ts test/ttl-cache-stale-invalidation-suite.ts test/main-feed-characterization-suite.ts test/main-feed-benchmark.ts test/employer-company-accounts-suite.ts test/employer-job-publishing-suite.ts; do
              if [ -f "$f" ]; then
                npx tsx "$f" || SUITES_EXIT=1
              fi
            done
          fi

          npm audit --json > /tmp/npm-audit.json 2>/tmp/npm-audit-stderr.txt
          AUDIT_EXIT=$?
          export LOCKFILE_EXIT INSTALL_EXIT TYPECHECK_EXIT BUILD_EXIT SUITES_EXIT AUDIT_EXIT
          node - <<'NODE'
          const fs = require('fs');
          let audit = {};
          try { audit = JSON.parse(fs.readFileSync('/tmp/npm-audit.json', 'utf8')); } catch {}
          const v = audit.metadata?.vulnerabilities || {};
          const packages = Object.entries(audit.vulnerabilities || {}).map(([name, item]) =>
            `- ${name}: ${item.severity}; direct=${item.isDirect}; fixAvailable=${JSON.stringify(item.fixAvailable)}`
          );
          const report = [
            '# Next.js dependency upgrade validation',
            '',
            '- Target: next@15.5.29',
            '- Lockfile generation exit: ' + process.env.LOCKFILE_EXIT,
            '- npm ci exit: ' + process.env.INSTALL_EXIT,
            '- TypeScript exit: ' + process.env.TYPECHECK_EXIT,
            '- Production build exit: ' + process.env.BUILD_EXIT,
            '- Regression suites exit: ' + process.env.SUITES_EXIT,
            '- npm audit exit: ' + process.env.AUDIT_EXIT,
            '- npm audit counts: ' + JSON.stringify(v),
            '',
            '## Vulnerable packages',
            ...(packages.length ? packages : ['- No package-level vulnerability data returned.']),
            '',
            'This report is generated by the isolated security-upgrade branch workflow. It does not deploy production.'
          ].join('\n');
          fs.writeFileSync('.security-upgrade-validation.md', report + '\n');
          NODE

          rm -f .github/workflows/dependency-refresh.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .security-upgrade-validation.md .github/workflows/dependency-refresh.yml
          git commit -m "chore: refresh Next.js 15.5.29 dependency lockfile" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
