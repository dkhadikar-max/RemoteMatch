name: CI

# This repo has no existing CI (confirmed during the PR #51 review: the only
# check on open PRs was "Supabase Preview", which reports SKIPPED and runs no
# tests). This workflow is intentionally narrow and generic, so it's safe to
# land on `main` on its own, independent of any other open PR's merge order:
#
#   - Typecheck always runs (repo-wide, no external credentials, nothing to
#     be missing).
#   - The self-contained PGlite test suites run only if their files exist in
#     the checkout at the time this runs — so this workflow works correctly
#     whether it merges before or after the PRs that introduce those files
#     (e.g. PR #51's test/swipe-limits-rolling-24h-suite.ts). It does not
#     hardcode an assumption that any particular branch/PR has already
#     landed.
#   - It does not run the rest of test/, most of which expects live
#     Supabase/Razorpay credentials this CI runner does not have and was
#     never authorized to receive. Broader CI coverage (the full test/
#     directory, live-tier gates, per-PR suites for other open PRs) is a
#     separate decision, not made here.
#
# Opened as its own PR, deliberately isolated from any product/migration
# change — kept unmerged pending explicit authorization.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  typecheck-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Self-contained suites (PGlite, no external credentials) -- only those present in this checkout
        run: |
          shopt -s nullglob
          suites=(
            test/swipe-limits-rolling-24h-suite.ts
          )
          ran_any=false
          for f in "${suites[@]}"; do
            if [ -f "$f" ]; then
              echo "::group::$f"
              npx tsx "$f"
              echo "::endgroup::"
              ran_any=true
            else
              echo "Skipping $f -- not present in this checkout (expected before its introducing PR merges)."
            fi
          done
          if [ "$ran_any" = false ]; then
            echo "No known self-contained suite files present yet -- nothing to run, not a failure."
          fi
